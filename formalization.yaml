# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Global class field theory in Lean 4.34.0"
  description: >-
    For every finite abelian extension L/K of number fields, the idèle class
    group C_K modulo the image of the idèle-class norm from C_L is isomorphic
    as a topological multiplicative group to Gal(L/K). The registered
    definition and theorem are supplied by the pinned ClassFieldTheory
    development.
  authors: ["Naganori Yamaguchi"]
  responsible_maintainers: ["Naganori Yamaguchi"]
  license: "Apache-2.0"

repository:
  substantive_formalization:
    id: "n-yamaguchi-0729/ClassFieldTheory"
    revision: "01b4614ee76fa6f50e7f3ea3e1cff93b85693345"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11R37"]

sources:
  - title: "Class Field Theory (version 4.03)"
    authors: ["J. S. Milne"]
    id: "https://www.jmilne.org/math/CourseNotes/CFT.pdf"
    type: book
    location: >-
      Chapter V, §5, Theorem 5.3(b), printed pp. 178–179
      (PDF pp. 187–188)
    relationship: formalizes
    note: >-
      The cited reciprocity law identifies C_K/N_{L/K}(C_L) with Gal(L/K)
      for every finite abelian extension. The Lean declaration records the
      resulting topological multiplicative equivalence as a nonempty type.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/5ed2965256430c3649e86755f9576b54eca72435"
    relationship: builds-on
    note: >-
      Mathlib supplies number fields, adèles, local completions, quotient
      groups, topological groups, field automorphisms, and finite abelian
      Galois extensions used by the Challenge and substantive proof.

status:
  scope: >-
    The selected theorem is
    ClassFieldTheory.GlobalClassFieldComparison.finiteAbelianGlobalReciprocity.
    It covers finite abelian extensions of number fields and identifies the
    idèle-class norm quotient with the relative Galois group as a topological
    multiplicative group. Nonempty records existence of an equivalence rather
    than choosing the normalized Artin map. Frobenius normalization and local
    compatibility are separate proved declarations listed in the README.
    Global function fields are not included.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Astra GPT-6 Codex"]
      framework: "Codex"
      tool_setup: >-
        AI-assisted Lean development and maintenance of the underlying CFT
        library, followed by statement review and preparation of this thin
        submission interface. Human authorship and responsibility remain with
        the named maintainer.
fidelity:
  divergences: >-
    Milne states the result through the canonical global Artin map. The
    compared theorem retains the induced topological norm-quotient
    equivalence but, by using Nonempty, does not select that map or include
    its arithmetic Frobenius normalization. The development is restricted to
    number fields.

review:
  status: "agent-reviewed"
  reviewers: ["Codex"]
  notes: >-
    The theorem type and the idèle-class norm type were compared with the
    pinned substantive source, and the mathematical statement was checked
    against Milne's reciprocity law.

alignment:
  namespace: "ClassFieldTheory.GlobalClassFieldComparison"
  statements:
    - source: >-
        J. S. Milne, Class Field Theory, Chapter V, §5, Theorem 5.3(b)
      lean: "ideleClassNorm"
      module: "ClassFieldTheory.AlgebraicNumberTheory.Idele.Extension.IdeleNorm"
      status: "definition supplied by the pinned substantive repository"
      note: >-
        Comparator replaces the deliberate Challenge definition hole with
        the determinant norm on relative idèles, transported to ordinary
        idèles and descended to idèle classes.
    - source: >-
        J. S. Milne, Class Field Theory, Chapter V, §5, Theorem 5.3(b)
      lean: "ClassFieldTheory.GlobalClassFieldComparison.finiteAbelianGlobalReciprocity"
      module: "ClassFieldTheory.GlobalClassFieldTheory.GlobalClassFields.MathlibGlobalReciprocity"
      status: "proved in the pinned substantive repository"
      note: >-
        The Challenge copies the exact theorem type and replaces only its
        proof with the deliberate Comparator placeholder.

acknowledgements: >-
  This development builds on Lean and Mathlib. Naganori Yamaguchi is the
  human author and responsible maintainer.
